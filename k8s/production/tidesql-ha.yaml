# TideSQL HA on Kubernetes -- single identical pool + lease-elected primary.
#
# Every pod is identical. Exactly one holds the `tidesql-primary` Lease and is
# the writer (primary); the rest are read-only replicas. A per-pod agent sidecar
# runs the election (k8s Lease) and, when it wins, promotes its local engine and
# labels its pod `role=primary` so the write Service routes to it. A recovered
# old primary boots as a replica (all pods start replica_mode=ON) and only
# becomes primary again if it re-wins the lease.
#
# Correctness note, split-brain safety does not depend on this agent being a
# perfect leader-election implementation. The engine's object-store epoch fence
# (single-writer fencing, validated by the failover suites -- test/ha_replication/
# here and tidesdb's test/failover/) guarantees a superseded primary's writes are
# never made authoritative. The lease is for availability and routing; the fence
# is the safety net -- which is what makes a compact bash agent the right tool
# for the election here.
---
apiVersion: v1
kind: Namespace
metadata:
  name: tidesql
---
# RBAC -- the agent needs to drive the Lease and relabel its own pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tidesql-agent
  namespace: tidesql
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tidesql-agent
  namespace: tidesql
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tidesql-agent
  namespace: tidesql
subjects:
  - kind: ServiceAccount
    name: tidesql-agent
    namespace: tidesql
roleRef:
  kind: Role
  name: tidesql-agent
  apiGroup: rbac.authorization.k8s.io
---
# The election lease. Pre-created unheld; the agents fight over it.
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: tidesql-primary
  namespace: tidesql
spec:
  leaseDurationSeconds: 15
---
# S3 credentials -- a Secret, never a ConfigMap. Prefer IRSA / workload identity
# on EKS/GKE so these can be removed entirely.
apiVersion: v1
kind: Secret
metadata:
  name: tidesql-s3
  namespace: tidesql
type: Opaque
stringData:
  S3_ACCESS_KEY: REPLACE_WITH_ACCESS_KEY
  S3_SECRET_KEY: REPLACE_WITH_SECRET_KEY
---
# Non-secret engine config. Identical on every pod. replica_mode=ON for all --
# the lease winner promotes itself at runtime; the keys come from the Secret and
# are substituted into the cnf at startup so they never live in this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tidesql-config
  namespace: tidesql
data:
  tidesdb.cnf: |
    [mariadb]
    plugin-load-add=ha_tidesdb.so

    # Object store (shared bucket -- the source of truth)
    tidesdb_object_store_backend=S3
    tidesdb_s3_endpoint=s3.amazonaws.com
    tidesdb_s3_bucket=tidesdb-production
    tidesdb_s3_region=us-east-1
    tidesdb_s3_access_key=__S3_ACCESS_KEY__
    tidesdb_s3_secret_key=__S3_SECRET_KEY__
    tidesdb_s3_use_ssl=ON
    tidesdb_s3_path_style=OFF
    tidesdb_objstore_local_cache_max=512M

    # Every pod boots read-only. The agent promotes the lease holder.
    tidesdb_replica_mode=ON
    tidesdb_replica_sync_interval=1000000

    # WAL durability to the bucket. wal_sync_on_commit=ON for RPO~=0 (costs commit
    # latency); leave OFF for async upload with a small RPO. Make this a conscious
    # choice -- see README.
    tidesdb_objstore_wal_sync_on_commit=OFF
    tidesdb_objstore_wal_sync_threshold=1M
    tidesdb_objstore_replicate_wal=ON
    tidesdb_objstore_replica_replay_wal=ON

    # Engine tuning
    tidesdb_unified_memtable=ON
    tidesdb_unified_memtable_write_buffer_size=128M
    tidesdb_block_cache_size=256M
    tidesdb_flush_threads=4
    tidesdb_compaction_threads=4
    tidesdb_log_level=INFO
---
# The election + role agent that runs as a sidecar in every pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tidesql-agent
  namespace: tidesql
data:
  agent.sh: |
    #!/bin/bash
    # Per-pod election agent. Holds the tidesql-primary Lease => this pod is the
    # primary. Optimistic-concurrency election via the resourceVersion on the
    # Lease object (kubectl replace fails 409 on a stale rv = someone else won).
    set -uo pipefail
    NS="${POD_NAMESPACE}"; POD="${POD_NAME}"
    LEASE=tidesql-primary
    TTL=15            # lease duration seconds (must match the Lease object)
    RENEW=5           # renew/poll interval seconds
    M="mariadb -h 127.0.0.1 -P 3306 -u root --connect-timeout=3"

    log(){ echo "[$(date -u +%FT%TZ)] agent: $*"; }
    now_s(){ date -u +%s; }
    # runtime role from the engine: 1 = replica, 0 = primary
    rt_role(){ $M -N -e "SHOW GLOBAL STATUS LIKE 'Tidesdb_replica_mode_active'" 2>/dev/null | awk '{print $2}'; }
    rt_epoch(){ $M -N -e "SHOW GLOBAL STATUS LIKE 'Tidesdb_primary_epoch'" 2>/dev/null | awk '{print $2}'; }
    label(){ kubectl -n "$NS" label pod "$POD" "role=$1" --overwrite >/dev/null 2>&1; }

    # Returns 0 if we hold the lease after this call (acquired, renewed, or already ours).
    hold_lease(){
      local json holder renew dur rv expired=0 ok
      json="$(kubectl -n "$NS" get lease "$LEASE" -o json 2>/dev/null)" || return 1
      holder="$(echo "$json" | jq -r '.spec.holderIdentity // ""')"
      renew="$(echo "$json"  | jq -r '.spec.renewTime // ""')"
      dur="$(echo "$json"    | jq -r '.spec.leaseDurationSeconds // 15')"
      rv="$(echo "$json"     | jq -r '.metadata.resourceVersion')"
      if [ -n "$renew" ]; then
        local rs; rs="$(date -u -d "$renew" +%s 2>/dev/null || echo 0)"
        [ $(( $(now_s) - rs )) -ge "$dur" ] && expired=1
      else
        expired=1
      fi
      # We can take it if it's ours, unheld, or expired.
      if [ "$holder" = "$POD" ] || [ -z "$holder" ] || [ "$expired" = "1" ]; then
        local ts; ts="$(date -u +%FT%T.%6NZ)"
        # Replace carrying the observed resourceVersion -> atomic CAS; 409 if lost.
        cat <<EOF | kubectl -n "$NS" replace -f - >/dev/null 2>&1
    apiVersion: coordination.k8s.io/v1
    kind: Lease
    metadata:
      name: $LEASE
      namespace: $NS
      resourceVersion: "$rv"
    spec:
      holderIdentity: $POD
      leaseDurationSeconds: $TTL
      acquireTime: "$ts"
      renewTime: "$ts"
    EOF
        return $?
      fi
      return 1   # held by someone else, not expired
    }

    log "starting on pod=$POD ns=$NS"
    while true; do
      if hold_lease; then
        # We are the elected primary.
        if [ "$(rt_role)" = "1" ]; then
          log "won lease; promoting local engine to primary"
          if $M -e "SET GLOBAL tidesdb_promote_primary=ON" 2>/dev/null; then
            log "promoted, epoch=$(rt_epoch)"
          else
            # Engine fence rejected the promotion (another node already holds a newer
            # epoch). We stay a replica; the next loop re-checks the lease and role.
            log "promote rejected by engine fence; staying replica"
          fi
        fi
        [ "$(rt_role)" = "0" ] && label primary
      else
        # Not the leader -> we are a replica. The engine self-demotes via the epoch
        # fence if we were a stale primary; we just reflect that in the label.
        label replica
      fi
      sleep "$RENEW"
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tidesql
  namespace: tidesql
spec:
  serviceName: tidesql
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: tidesql
  template:
    metadata:
      labels:
        app: tidesql
        role: replica          # every pod starts as a replica; the agent relabels the leader
    spec:
      serviceAccountName: tidesql-agent
      terminationGracePeriodSeconds: 30
      containers:
        - name: mariadb
          image: tidesdb/tidesql:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              mkdir -p /etc/mysql/custom
              # substitute the S3 secret env vars into the cnf so they never sit in the ConfigMap
              sed -e "s|__S3_ACCESS_KEY__|${S3_ACCESS_KEY}|" \
                  -e "s|__S3_SECRET_KEY__|${S3_SECRET_KEY}|" \
                  /opt/tidesdb-config/tidesdb.cnf > /etc/mysql/custom/tidesdb-k8s.cnf
              exec /usr/local/bin/tidesql-entrypoint.sh
          env:
            - name: S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: tidesql-s3, key: S3_ACCESS_KEY } }
            - name: S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: tidesql-s3, key: S3_SECRET_KEY } }
          ports:
            - { containerPort: 3306, name: mysql }
          volumeMounts:
            - { name: config, mountPath: /opt/tidesdb-config/tidesdb.cnf, subPath: tidesdb.cnf }
            - { name: data, mountPath: /var/lib/mysql }
          readinessProbe:
            exec: { command: ["mariadb", "-h", "localhost", "-e", "SELECT 1"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["mariadb-admin", "ping", "-h", "localhost"] }
            initialDelaySeconds: 30
            periodSeconds: 10
        - name: agent
          # needs kubectl + jq + the mariadb client. Build a tiny image, or extend
          # tidesdb/tidesql with kubectl+jq. Placeholder below.
          image: tidesdb/tidesql-agent:latest
          command: ["/bin/bash", "/agent/agent.sh"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          volumeMounts:
            - { name: agent, mountPath: /agent }
      volumes:
        - name: config
          configMap: { name: tidesql-config }
        - name: agent
          configMap: { name: tidesql-agent, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata:
        name: data            # local cache over S3; warm across restarts
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3   # EKS-specific; change for your platform (e.g. standard, premium-rwo)
        resources:
          requests:
            storage: 100Gi
---
# Write endpoint -- routes ONLY to the current primary (the relabeled pod).
apiVersion: v1
kind: Service
metadata:
  name: tidesql-write
  namespace: tidesql
spec:
  type: ClusterIP
  selector:
    app: tidesql
    role: primary
  ports:
    - { port: 3306, targetPort: 3306, name: mysql }
---
# Read endpoint -- any pod (primary or replica).
apiVersion: v1
kind: Service
metadata:
  name: tidesql-read
  namespace: tidesql
spec:
  type: ClusterIP
  selector:
    app: tidesql
  ports:
    - { port: 3306, targetPort: 3306, name: mysql }
---
# Headless service for stable per-pod DNS (StatefulSet requirement).
apiVersion: v1
kind: Service
metadata:
  name: tidesql
  namespace: tidesql
spec:
  clusterIP: None
  selector:
    app: tidesql
  ports:
    - { port: 3306, targetPort: 3306, name: mysql }
