name: HA Replication (SQL failover, FS backend)

# SQL-level single-writer failover for TideSQL, mirroring the tidesdb library's
# failover suite one layer up: real mariadbd nodes sharing an FS object-store
# bucket, driven over SQL. Uses the FS backend (no S3/MinIO), so it is fast and
# dependency-free -- the analogue of the library's failover_local tier.
#
# Building MariaDB + the plugin is heavy, so this runs nightly + on demand + on
# PRs that touch the plugin or the harness. A real-MinIO S3 tier (the analogue of
# the library's failover_k8s) runs separately in ha_replication_k8s.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
  pull_request:
    branches: [ "master" ]
    paths:
      - "tidesdb/**"
      - "test/ha_replication/**"
      - ".github/workflows/ha_replication.yml"

jobs:
  ha-replication:
    runs-on: ubuntu-latest
    name: SQL failover (FS object store)
    steps:
      - name: Checkout TideSQL
        uses: actions/checkout@v4
        with:
          path: tidesql

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build bison libssl-dev \
            libjemalloc2 libjemalloc-dev libncurses-dev pkg-config

      - name: Build TidesDB library + MariaDB + plugin
        working-directory: tidesql
        run: |
          # default build: FS object-store backend is always compiled in (no S3 needed).
          ./install.sh --mariadb-prefix "$GITHUB_WORKSPACE/mariadb" \
                       --build-dir "$GITHUB_WORKSPACE/build" --jobs "$(nproc)"

      - name: Run SQL failover scenarios (FS backend)
        working-directory: tidesql
        env:
          TIDESQL_PREFIX: ${{ github.workspace }}/mariadb
          TDB_HA_JEMALLOC: /usr/lib/x86_64-linux-gnu/libjemalloc.so.2
        run: |
          chmod +x test/ha_replication/run_local.sh
          ./test/ha_replication/run_local.sh

      - name: Node logs on failure
        if: failure()
        working-directory: tidesql
        run: |
          for f in test/ha_replication/.scratch/n*/err.log; do
            echo "===== $f ====="; tail -60 "$f" || true
          done
