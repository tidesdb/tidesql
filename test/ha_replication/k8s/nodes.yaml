# Cluster nodes for the SQL failover simulation, three mariadbd servers, all
# booting as replicas pointed at the shared MinIO bucket. run_k8s.sh promotes one
# to primary. The image is built from test/ha_replication/Dockerfile and loaded
# into kind. restartPolicy Never so deleting a pod is a real node loss; three
# nodes let the matrix cover re-follow after promotion, zombie fencing of a live
# old primary, and fencing of an old primary partitioned from the bucket (the pods
# carry NET_ADMIN so the partition scenario can sever egress to MinIO with iptables).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tidesql-node-env
data:
  TDB_NODE_PORT: "3306"
  TDB_NODE_WAL_SYNC_ON_COMMIT: "1"
  TDB_NODE_WRITE_BUFFER: "256K"
  TDB_NODE_REPLICA_SYNC_US: "500000"
  TIDESDB_S3_ENDPOINT: "minio:9000"
  TIDESDB_S3_BUCKET: "tidesql-failover"
  TIDESDB_S3_ACCESS_KEY: "minioadmin"
  TIDESDB_S3_SECRET_KEY: "minioadmin"
---
apiVersion: v1
kind: Pod
metadata:
  name: tidesql-node-0
  labels: { app: tidesql-node }
spec:
  restartPolicy: Never
  containers:
    - name: node
      image: tidesql-node:ci
      imagePullPolicy: Never
      envFrom:
        - configMapRef: { name: tidesql-node-env }
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]   # the partition scenario runs iptables inside the pod's netns
      readinessProbe:
        exec: { command: ["mariadb", "-h", "127.0.0.1", "-uroot", "-e", "SELECT 1"] }
        initialDelaySeconds: 5
        periodSeconds: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: tidesql-node-1
  labels: { app: tidesql-node }
spec:
  restartPolicy: Never
  containers:
    - name: node
      image: tidesql-node:ci
      imagePullPolicy: Never
      envFrom:
        - configMapRef: { name: tidesql-node-env }
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
      readinessProbe:
        exec: { command: ["mariadb", "-h", "127.0.0.1", "-uroot", "-e", "SELECT 1"] }
        initialDelaySeconds: 5
        periodSeconds: 3
---
apiVersion: v1
kind: Pod
metadata:
  name: tidesql-node-2
  labels: { app: tidesql-node }
spec:
  restartPolicy: Never
  containers:
    - name: node
      image: tidesql-node:ci
      imagePullPolicy: Never
      envFrom:
        - configMapRef: { name: tidesql-node-env }
      securityContext:
        capabilities:
          add: ["NET_ADMIN"]
      readinessProbe:
        exec: { command: ["mariadb", "-h", "127.0.0.1", "-uroot", "-e", "SELECT 1"] }
        initialDelaySeconds: 5
        periodSeconds: 3
